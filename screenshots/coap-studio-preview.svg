<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="amberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#162032"/>
      <stop offset="100%" stop-color="#131c2e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Header Bar -->
  <rect x="0" y="0" width="1200" height="70" fill="#0b1329" stroke="#2a3a53" stroke-width="1"/>
  <rect x="30" y="15" width="40" height="40" rx="8" fill="url(#amberCyan)"/>
  <text x="50" y="41" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="12" text-anchor="middle">CoAP</text>
  <text x="85" y="38" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="20">CoAPForge <tspan fill="#0ea5e9">Pro</tspan></text>
  <text x="85" y="54" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">IETF RFC 7252, RFC 7641 &amp; RFC 7959 IoT Protocol Studio</text>

  <!-- Profile Tag -->
  <rect x="880" y="20" width="290" height="32" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="895" y="41" fill="#0ea5e9" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Smart Grid AMI &amp; Utility Metering (DTLS)</text>

  <!-- Sidebar (Left) -->
  <rect x="30" y="90" width="320" height="555" rx="8" fill="url(#cardGrad)" stroke="#2a3a53"/>
  <text x="50" y="125" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="15">CoAP Packet Forger</text>

  <rect x="50" y="145" width="280" height="50" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="165" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">MESSAGE TYPE</text>
  <text x="65" y="183" fill="#0ea5e9" font-family="monospace" font-size="12" font-weight="700">CON (0 - Confirmable / Requires ACK)</text>

  <rect x="50" y="210" width="280" height="50" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="230" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">METHOD / CODE</text>
  <text x="65" y="248" fill="#10b981" font-family="monospace" font-size="12" font-weight="700">0.01 GET (Retrieve Resource)</text>

  <rect x="50" y="275" width="280" height="50" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="295" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">URI-PATH (OPTION 11)</text>
  <text x="65" y="313" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="700">sensors/temperature</text>

  <rect x="50" y="340" width="280" height="65" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="360" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">BLOCK-WISE SZX (RFC 7959)</text>
  <text x="65" y="380" fill="#f1f5f9" font-family="monospace" font-size="12">64 Bytes (SZX=2 / 802.15.4 MTU)</text>
  <text x="65" y="398" fill="#0ea5e9" font-family="-apple-system, sans-serif" font-size="10">More (M): 1 | Block Num: 0</text>

  <rect x="50" y="420" width="280" height="65" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="65" y="440" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">APPLICATION PAYLOAD</text>
  <text x="65" y="460" fill="#a7f3d0" font-family="monospace" font-size="11">{"temp": 24.5, "unit": "C"}</text>
  <text x="65" y="476" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10">Content-Format: application/json (50)</text>

  <text x="50" y="520" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="14">Zero-Trust CoAP Controls</text>
  <text x="70" y="548" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ DTLS 1.2/1.3 Mutual TLS (coaps://)</text>
  <text x="70" y="575" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ Amplification Factor Throttling</text>
  <text x="70" y="602" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ Strict Sequential Option Parsing</text>
  <text x="70" y="628" fill="#10b981" font-family="-apple-system, sans-serif" font-size="13">✓ High-Entropy CSPRNG Tokens</text>

  <!-- Right Dashboard -->
  <!-- 4 KPI Cards -->
  <rect x="375" y="90" width="185" height="85" rx="6" fill="#162032" stroke="#2a3a53"/>
  <text x="390" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">PACKET TYPE</text>
  <text x="390" y="142" fill="#0ea5e9" font-family="monospace" font-size="20" font-weight="700">CON (0.01)</text>
  <text x="390" y="162" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Control Byte 0x44</text>

  <rect x="575" y="90" width="185" height="85" rx="6" fill="#162032" stroke="#2a3a53"/>
  <text x="590" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">WIRE FRAME SIZE</text>
  <text x="590" y="142" fill="#14b8a6" font-family="monospace" font-size="22" font-weight="700">89 Bytes</text>
  <text x="590" y="162" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Ethernet II + UDP</text>

  <rect x="775" y="90" width="185" height="85" rx="6" fill="#162032" stroke="#2a3a53"/>
  <text x="790" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">PARSED OPTIONS</text>
  <text x="790" y="142" fill="#f59e0b" font-family="monospace" font-size="22" font-weight="700">3 Options</text>
  <text x="790" y="162" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11">Delta Encoded</text>

  <rect x="975" y="90" width="195" height="85" rx="6" fill="#162032" stroke="#2a3a53"/>
  <text x="990" y="112" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="10" font-weight="700">ZERO-TRUST AUDIT</text>
  <text x="990" y="142" fill="#10b981" font-family="monospace" font-size="22" font-weight="700">100/100</text>
  <text x="990" y="162" fill="#10b981" font-family="-apple-system, sans-serif" font-size="11">Grade A+ (Certified)</text>

  <!-- Packet Dissector & Hex Dump -->
  <rect x="375" y="195" width="795" height="450" rx="8" fill="url(#cardGrad)" stroke="#2a3a53"/>
  <text x="400" y="230" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="16">Bit-Accurate Binary Frame Dissector &amp; Wireshark Hex Dump</text>

  <rect x="400" y="250" width="745" height="150" rx="6" fill="#080d1a" stroke="#2a3a53"/>
  <text x="415" y="275" fill="#38bdf8" font-family="monospace" font-size="11">0000   00 aa bb cc dd ee 00 1a 2b 3c 4d 5e 08 00 45 00</text>
  <text x="415" y="295" fill="#38bdf8" font-family="monospace" font-size="11">0010   00 4b 1a 2b 40 00 40 11 23 88 c0 a8 01 32 c0 a8</text>
  <text x="415" y="315" fill="#38bdf8" font-family="monospace" font-size="11">0020   01 01 c0 00 16 33 00 37 b2 14 42 01 4a 12 7a 8b</text>
  <text x="415" y="335" fill="#38bdf8" font-family="monospace" font-size="11">0030   b7 73 65 6e 73 6f 72 73 0b 74 65 6d 70 65 72 61</text>
  <text x="415" y="355" fill="#38bdf8" font-family="monospace" font-size="11">0040   74 75 72 65 11 32 ff 7b 22 74 65 6d 70 22 3a 20</text>
  <text x="415" y="375" fill="#38bdf8" font-family="monospace" font-size="11">0050   32 34 2e 35 7d 00 e5 fa 7a 1b</text>

  <!-- Live Option Breakdown Box -->
  <rect x="400" y="415" width="745" height="100" rx="6" fill="#0f172a" stroke="#2a3a53"/>
  <text x="415" y="440" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">OPTION DELTA-ENCODING CALCULATION</text>
  <text x="415" y="465" fill="#f1f5f9" font-family="monospace" font-size="12">Opt #11 (Uri-Path="sensors") Delta=11 Len=7 | Opt #11 ("temperature") Delta=0 Len=11</text>
  <text x="415" y="495" fill="#10b981" font-family="-apple-system, sans-serif" font-size="12" font-weight="700">✓ DECODE VERIFIED: Option #12 (Content-Format=50 application/json) Delta=1 Len=1</text>

  <!-- Synthesizer Snippet -->
  <rect x="400" y="525" width="745" height="100" rx="6" fill="#1e293b" stroke="#2a3a53"/>
  <text x="415" y="548" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">SYNTHESIZED PROTOCOL CODE (C99 / libcoap v4.3+)</text>
  <text x="415" y="570" fill="#0ea5e9" font-family="monospace" font-size="11">coap_endpoint_t *ep = coap_new_endpoint(ctx, &amp;dst, COAP_PROTO_DTLS);</text>
  <text x="415" y="590" fill="#94a3b8" font-family="monospace" font-size="11">coap_register_handler(res, COAP_REQUEST_GET, hnd_get_telemetry);</text>
</svg>
