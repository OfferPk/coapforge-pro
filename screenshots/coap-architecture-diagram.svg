<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="100%" height="100%">
  <defs>
    <linearGradient id="diagramBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#162032"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="550" fill="url(#diagramBg)"/>

  <!-- Title -->
  <text x="500" y="40" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="800" font-size="20" text-anchor="middle">
    IETF RFC 7252, RFC 7641 &amp; RFC 7959 CoAP Architecture
  </text>
  <text x="500" y="65" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">
    Header Framing, Sequential Option Delta-Encoding &amp; Block-Wise Transfer Slicing
  </text>

  <!-- 1. Fixed 4-Byte Header & Token -->
  <g transform="translate(80, 95)">
    <rect x="0" y="0" width="840" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="420" y="25" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      CoAP Message Header (RFC 7252 Section 3)
    </text>

    <!-- Byte 0 -->
    <rect x="30" y="45" width="220" height="45" rx="4" fill="#0369a1" stroke="#38bdf8"/>
    <text x="140" y="67" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle">
      Byte 0: Ver (2b) | T (2b) | TKL (4b)
    </text>
    <text x="140" y="82" fill="#bae6fd" font-family="monospace" font-size="10" text-anchor="middle">
      Ver=1 | CON (0) | TKL=4 → 0x44
    </text>

    <!-- Byte 1 -->
    <rect x="260" y="45" width="180" height="45" rx="4" fill="#047857" stroke="#34d399"/>
    <text x="350" y="67" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle">
      Byte 1: Code (c.dd)
    </text>
    <text x="350" y="82" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">
      0.01 GET / 2.05 Content
    </text>

    <!-- Bytes 2..3 -->
    <rect x="450" y="45" width="180" height="45" rx="4" fill="#b45309" stroke="#f59e0b"/>
    <text x="540" y="67" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle">
      Bytes 2..3: Message ID
    </text>
    <text x="540" y="82" fill="#fef08a" font-family="monospace" font-size="10" text-anchor="middle">
      16-bit Network Byte Order
    </text>

    <!-- Token -->
    <rect x="640" y="45" width="170" height="45" rx="4" fill="#6d28d9" stroke="#a78bfa"/>
    <text x="725" y="67" fill="#ffffff" font-family="-apple-system, sans-serif" font-weight="700" font-size="11" text-anchor="middle">
      Token (0 to 8 Bytes)
    </text>
    <text x="725" y="82" fill="#ede9fe" font-family="monospace" font-size="10" text-anchor="middle">
      CSPRNG Match Request/Response
    </text>
  </g>

  <!-- 2. Option Delta Encoding -->
  <g transform="translate(80, 225)">
    <rect x="0" y="0" width="840" height="140" rx="8" fill="#0f172a" stroke="#2a3a53"/>
    <text x="420" y="25" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      Sequential Option Delta-Encoding (RFC 7252 Section 3.1)
    </text>

    <text x="40" y="55" fill="#38bdf8" font-family="monospace" font-size="12">
      Header Byte = (Option Delta &lt;&lt; 4) | (Option Length &amp; 0x0F)
    </text>
    <text x="40" y="80" fill="#94a3b8" font-family="monospace" font-size="11">
      • Option #11 (Uri-Path="sensors")      → Delta = 11 - 0 = 11 (0xB), Length = 7  → 0xB7
    </text>
    <text x="40" y="102" fill="#94a3b8" font-family="monospace" font-size="11">
      • Option #11 (Uri-Path="temperature")  → Delta = 11 - 11 = 0 (0x0), Length = 11 → 0x0B
    </text>
    <text x="40" y="124" fill="#10b981" font-family="monospace" font-size="11">
      • Option #12 (Content-Format=50 JSON)  → Delta = 12 - 11 = 1 (0x1), Length = 1  → 0x11
    </text>
  </g>

  <!-- 3. RFC 7959 Block-Wise Transfer -->
  <g transform="translate(80, 385)">
    <rect x="0" y="0" width="840" height="135" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="420" y="25" fill="#f1f5f9" font-family="-apple-system, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      RFC 7959 Block-Wise Transfer Slicing (Block1 / Block2)
    </text>

    <text x="40" y="55" fill="#f59e0b" font-family="monospace" font-size="12">
      Block Option Value = (NUM &lt;&lt; 4) | (M &lt;&lt; 3) | SZX  (Block Size = 2^(SZX+4))
    </text>
    <text x="40" y="80" fill="#f1f5f9" font-family="monospace" font-size="11">
      [Block #0] SZX=2 (64B), M=1 (More)  → Value = (0 &lt;&lt; 4) | (1 &lt;&lt; 3) | 2 = 0x0A (10)
    </text>
    <text x="40" y="102" fill="#f1f5f9" font-family="monospace" font-size="11">
      [Block #1] SZX=2 (64B), M=1 (More)  → Value = (1 &lt;&lt; 4) | (1 &lt;&lt; 3) | 2 = 0x1A (26)
    </text>
    <text x="40" y="124" fill="#10b981" font-family="monospace" font-size="11">
      [Block #2] SZX=2 (64B), M=0 (Final) → Value = (2 &lt;&lt; 4) | (0 &lt;&lt; 3) | 2 = 0x22 (34)
    </text>
  </g>
</svg>
